version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  gateway:
    image: ${DOCKERHUB_USERNAME:-akhand2007}/ai-interview-gateway:latest
    build:
      context: ./backend
      dockerfile: ./gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - REDIS_URL=redis://redis:6379
      - AUTH_SERVICE_URL=http://auth:8001
      - RESUME_SERVICE_URL=http://resume:8002
      - INTERVIEW_SERVICE_URL=http://interview:8003
      - ROADMAP_SERVICE_URL=http://roadmap:8004
      - BILLING_SERVICE_URL=http://billing:8005
      - FRONTEND_URL=${FRONTEND_PUBLIC_URL:-http://localhost}
    depends_on:
      - redis
      - auth
      - resume
      - interview
      - roadmap
      - billing

  auth:
    image: ${DOCKERHUB_USERNAME:-akhand2007}/ai-interview-auth:latest
    build:
      context: ./backend
      dockerfile: ./services/auth/Dockerfile
    environment:
      - PORT=8001
      - MONGODB_URL=${AUTH_MONGODB_URL:-mongodb://mongodb:27017/auth_db}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - redis

  resume:
    image: ${DOCKERHUB_USERNAME:-akhand2007}/ai-interview-resume:latest
    build:
      context: ./backend
      dockerfile: ./services/resume/Dockerfile
    environment:
      - PORT=8002
      - MONGODB_URL=${RESUME_MONGODB_URL:-mongodb://mongodb:27017/resume_db}
      - REDIS_URL=redis://redis:6379
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - mongodb
      - redis

  interview:
    image: ${DOCKERHUB_USERNAME:-akhand2007}/ai-interview-interview:latest
    build:
      context: ./backend
      dockerfile: ./services/interview/Dockerfile
    environment:
      - PORT=8003
      - MONGODB_URL=${INTERVIEW_MONGODB_URL:-mongodb://mongodb:27017/interview_db}
      - REDIS_URL=redis://redis:6379
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - mongodb
      - redis

  roadmap:
    image: ${DOCKERHUB_USERNAME:-akhand2007}/ai-interview-roadmap:latest
    build:
      context: ./backend
      dockerfile: ./services/roadmap/Dockerfile
    environment:
      - PORT=8004
      - MONGODB_URL=${ROADMAP_MONGODB_URL:-mongodb://mongodb:27017/roadmap_db}
      - REDIS_URL=redis://redis:6379
      - GROQ_API_KEY=${GROQ_API_KEY}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
    depends_on:
      - mongodb
      - redis

  billing:
    image: ${DOCKERHUB_USERNAME:-akhand2007}/ai-interview-billing:latest
    build:
      context: ./backend
      dockerfile: ./services/billing/Dockerfile
    environment:
      - PORT=8005
      - MONGODB_URL=${BILLING_MONGODB_URL:-mongodb://mongodb:27017/billing_db}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
    depends_on:
      - mongodb

  frontend:
    image: ${DOCKERHUB_USERNAME:-akhand2007}/ai-interview-frontend:latest
    build:
      context: ./frontend
      args:
        - VITE_FIREBASE_APIKEY=${VITE_FIREBASE_APIKEY}
        - VITE_RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
        - VITE_BACKEND_URL=${GATEWAY_PUBLIC_URL:-http://localhost:8000}
    ports:
      - "80:80"
    depends_on:
      - gateway

volumes:
  mongodb_data:
